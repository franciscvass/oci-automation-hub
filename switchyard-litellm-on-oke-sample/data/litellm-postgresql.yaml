# Applied in litellm_namespace by the existing Terraform/operator workflow.
apiVersion: v1
kind: Service
metadata:
  name: litellm-postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: litellm-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
# This independent PVC survives StatefulSet replacement. Removing the database
# data requires an explicit PVC/volume cleanup; workload deletion is not a backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-postgresql-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-postgresql
spec:
  serviceName: litellm-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-postgresql
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: postgres:16.15-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: litellm-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: litellm-postgresql-data
