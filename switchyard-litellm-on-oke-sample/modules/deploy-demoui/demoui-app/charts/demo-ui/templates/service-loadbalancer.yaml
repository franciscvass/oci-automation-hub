{{- if .Values.loadbalancer.enabled }}
{{- $_ := required "Set loadbalancer.annotations.oci.oraclecloud.com/oci-network-security-groups to the load balancer NSG OCID." (index .Values.loadbalancer.annotations "oci.oraclecloud.com/oci-network-security-groups") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-ui.loadbalancerFullname" . }}
  labels:
    {{- include "demo-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadbalancer
  annotations:
    {{- toYaml .Values.loadbalancer.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    {{- include "demo-ui.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.loadbalancer.port }}
      targetPort: http
{{- end }}
